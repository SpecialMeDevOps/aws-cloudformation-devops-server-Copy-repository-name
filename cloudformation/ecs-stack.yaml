AWSTemplateFormatVersion: '2010-09-09'
Description: Example ECS stack template for the IT Your IT House platform.

Parameters:
  ProjectName:
    Type: String
    Default: it-your-it-house
  Environment:
    Type: String
    Default: dev

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${Environment}-cluster"
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ClusterName:
    Value: !Ref EcsCluster

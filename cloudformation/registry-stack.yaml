AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repositories for immutable application release images.

Parameters:
  ProjectName:
    Type: String
    Default: it-your-it-house
    AllowedPattern: "[a-zA-Z0-9][a-zA-Z0-9._-]*"
  Environment:
    Type: String
    Default: dev
    AllowedPattern: "[a-zA-Z0-9][a-zA-Z0-9._-]*"

Resources:
  FrontendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-frontend"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Retain the most recent fifty immutable build images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["build-", "sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 50
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Retain the most recent fifty immutable build images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["build-", "sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 50
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  FrontendRepositoryName:
    Value: !Ref FrontendRepository
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  BackendRepositoryName:
    Value: !Ref BackendRepository
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri

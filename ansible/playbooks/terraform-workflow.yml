---
- name: Run a reviewed Terraform CloudFormation-stack workflow
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    terraform_directory: "{{ playbook_dir }}/../../terraform"
    configured_state_bucket: "{{ lookup('env', 'TF_STATE_BUCKET') | trim }}"
    aws_region: "{{ lookup('env', 'AWS_REGION') }}"
    environment_name: "{{ lookup('env', 'TF_VAR_environment') | default('dev', true) }}"
    project_name: "{{ lookup('env', 'TF_VAR_project_name') | default('it-your-it-house', true) }}"
    cluster_api_access_cidrs: "{{ lookup('env', 'TF_VAR_kubernetes_api_access_cidrs') | from_json }}"
  tasks:
    - name: Validate workflow mode and remote-state settings
      ansible.builtin.assert:
        that:
          - terraform_operation in ['plan', 'apply']
          - aws_region | length > 0
        fail_msg: "Terraform requires a plan/apply mode and AWS_REGION."

    - name: Require the application deployment flag when requested
      ansible.builtin.assert:
        that:
          - lookup('env', 'TF_VAR_deploy_application') | bool
        fail_msg: >-
          This approved workflow requires TF_VAR_deploy_application=true;
          no infrastructure plan or apply was run.
      when: require_application_deployment | default(false) | bool

    - name: Use the explicitly configured Terraform state bucket
      ansible.builtin.set_fact:
        terraform_state_bucket: "{{ configured_state_bucket }}"
      when: configured_state_bucket | length > 0

    - name: Resolve the Terraform state bucket from its bootstrap stack
      ansible.builtin.command:
        argv:
          - aws
          - cloudformation
          - describe-stacks
          - --stack-name
          - "{{ project_name }}-terraform-state"
          - --query
          - "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue | [0]"
          - --output
          - text
          - --region
          - "{{ aws_region }}"
      register: terraform_state_bucket_output
      changed_when: false
      when: configured_state_bucket | length == 0

    - name: Save the discovered Terraform state bucket
      ansible.builtin.set_fact:
        terraform_state_bucket: "{{ terraform_state_bucket_output.stdout | trim }}"
      when: configured_state_bucket | length == 0

    - name: Require a valid Terraform state bucket name
      ansible.builtin.assert:
        that:
          - terraform_state_bucket is match("^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$")
        fail_msg: >-
          No valid Terraform state bucket was configured or found in the
          {{ project_name }}-terraform-state CloudFormation stack. Bootstrap the
          retained state stack or set TF_STATE_BUCKET to its output bucket name.

    - name: Require deployment settings for an application stack
      ansible.builtin.assert:
        that:
          - lookup('env', 'TF_VAR_jenkins_role_arn') is match("^arn:aws:iam::[0-9]{12}:role/.+$")
          - lookup('env', 'TF_VAR_kubernetes_operator_principal_arn') is match("^arn:aws:iam::[0-9]{12}:(role|user)/.+$")
          - cluster_api_access_cidrs | length > 0
          - "'0.0.0.0/0' not in cluster_api_access_cidrs"
          - lookup('env', 'TF_VAR_kubernetes_version') is match("^1\\.(2[8-9]|[3-9][0-9])$")
        fail_msg: >-
          EKS deployment requires the Jenkins IAM role ARN, a distinct Kubernetes
          operator IAM principal, Kubernetes 1.28+ for default API data encryption, and
          explicitly allowlisted client CIDRs. Image digests are verified and
          supplied to Kubernetes only after the Trivy-gated ECR push.
      when:
        - terraform_operation == 'plan'
        - lookup('env', 'TF_VAR_deploy_application') | bool

    - name: Require explicit approval before applying infrastructure
      ansible.builtin.assert:
        that:
          - approved_cloudformation_change | default(false) | bool
        fail_msg: "Terraform apply is blocked until the reviewed CloudFormation change is approved."
      when: terraform_operation == 'apply'

    - name: Initialize the S3 remote backend
      ansible.builtin.command:
        argv:
          - terraform
          - init
          - -input=false
          - -backend-config=bucket={{ terraform_state_bucket }}
          - -backend-config=key={{ project_name }}/{{ environment_name }}/terraform.tfstate
          - -backend-config=region={{ aws_region }}
          - -backend-config=encrypt=true
          - -backend-config=use_lockfile=true
        chdir: "{{ terraform_directory }}"
      changed_when: false
      when: terraform_operation == 'plan'

    - name: Read Terraform resource ownership state
      ansible.builtin.command:
        argv:
          - terraform
          - state
          - list
        chdir: "{{ terraform_directory }}"
      register: terraform_state_addresses
      changed_when: false
      failed_when: >-
        terraform_state_addresses.rc != 0 and
        'No state file was found' not in terraform_state_addresses.stderr
      when: terraform_operation == 'plan'

    - name: Block planning while the legacy Terraform network remains tracked
      ansible.builtin.assert:
        that:
          - >-
            (terraform_state_addresses.stdout_lines | default([]) |
            select('match', '^module[.]network([.]|$)') | list | length) == 0
        fail_msg: >-
          The legacy Terraform-managed network is still recorded in remote state.
          Reconcile its ownership and any live VPC/NAT resources before planning
          the CloudFormation-managed EKS network; this workflow will not silently
          abandon the old network state and create a duplicate.
      when: terraform_operation == 'plan'

    - name: Check whether the registry CloudFormation stack already exists
      ansible.builtin.command:
        argv:
          - aws
          - cloudformation
          - describe-stacks
          - --stack-name
          - "{{ project_name }}-{{ environment_name }}-registry"
          - --query
          - "Stacks[0].StackId"
          - --output
          - text
          - --region
          - "{{ aws_region }}"
      register: registry_stack
      changed_when: false
      failed_when: registry_stack.rc != 0 and 'does not exist' not in registry_stack.stderr
      when: terraform_operation == 'plan'

    - name: Check whether prior frontend ECR repository exists
      ansible.builtin.command:
        argv:
          - aws
          - ecr
          - describe-repositories
          - --repository-names
          - "{{ project_name }}-frontend"
          - --query
          - "repositories[0].repositoryName"
          - --output
          - text
          - --region
          - "{{ aws_region }}"
      register: frontend_repository
      changed_when: false
      failed_when: frontend_repository.rc != 0 and 'RepositoryNotFoundException' not in frontend_repository.stderr
      when: terraform_operation == 'plan'

    - name: Check whether prior backend ECR repository exists
      ansible.builtin.command:
        argv:
          - aws
          - ecr
          - describe-repositories
          - --repository-names
          - "{{ project_name }}-backend"
          - --query
          - "repositories[0].repositoryName"
          - --output
          - text
          - --region
          - "{{ aws_region }}"
      register: backend_repository
      changed_when: false
      failed_when: backend_repository.rc != 0 and 'RepositoryNotFoundException' not in backend_repository.stderr
      when: terraform_operation == 'plan'

    - name: Block unmanaged registry resource adoption or replacement
      ansible.builtin.assert:
        that:
          - >-
            registry_stack.rc != 0 or
            'aws_cloudformation_stack.registry' in (terraform_state_addresses.stdout_lines | default([]))
          - >-
            registry_stack.rc == 0 or
            'aws_cloudformation_stack.registry' not in (terraform_state_addresses.stdout_lines | default([]))
          - >-
            registry_stack.rc == 0 or
            (frontend_repository.rc != 0 and backend_repository.rc != 0)
        fail_msg: >-
          Existing registry resources are not represented by the current Terraform
          CloudFormation-stack state. Import/migrate and review the old state and
          ECR repositories before planning or applying; this workflow will not adopt
          or replace them automatically.
      when: terraform_operation == 'plan'

    - name: Check existing application stack ownership
      ansible.builtin.command:
        argv:
          - aws
          - cloudformation
          - describe-stacks
          - --stack-name
          - "{{ item.name }}"
          - --query
          - "Stacks[0].StackId"
          - --output
          - text
          - --region
          - "{{ aws_region }}"
      loop:
        - name: "{{ project_name }}-{{ environment_name }}-application"
          address: aws_cloudformation_stack.application[0]
      loop_control:
        label: "{{ item.name }}"
      register: application_stack_checks
      changed_when: false
      failed_when: application_stack_checks.rc != 0 and 'does not exist' not in application_stack_checks.stderr
      when:
        - terraform_operation == 'plan'
        - lookup('env', 'TF_VAR_deploy_application') | bool

    - name: Inspect an existing application stack for obsolete public/ECS resources
      ansible.builtin.command:
        argv:
          - aws
          - cloudformation
          - describe-stack-resources
          - --stack-name
          - "{{ project_name }}-{{ environment_name }}-application"
          - --query
          - "StackResources[?starts_with(ResourceType, 'AWS::ECS::') || starts_with(ResourceType, 'AWS::CloudFront::') || starts_with(ResourceType, 'AWS::ElasticLoadBalancingV2::')].LogicalResourceId"
          - --output
          - json
          - --region
          - "{{ aws_region }}"
      register: obsolete_application_resources
      changed_when: false
      when:
        - terraform_operation == 'plan'
        - lookup('env', 'TF_VAR_deploy_application') | bool
        - application_stack_checks.results[0].rc == 0

    - name: Block an implicit migration of the existing ECS application stack
      ansible.builtin.assert:
        that:
          - obsolete_application_resources.stdout | from_json | length == 0
        fail_msg: >-
          The existing application CloudFormation stack still owns ECS, ALB, or
          CloudFront resources. Updating its template would replace/remove the
          previous deployment without a CloudFormation resource-level review.
          Migrate or retire that stack in a separately approved change before
          planning the EKS deployment.
      when:
        - terraform_operation == 'plan'
        - lookup('env', 'TF_VAR_deploy_application') | bool
        - application_stack_checks.results[0].rc == 0

    - name: Block unmanaged application or monitoring stack adoption
      ansible.builtin.assert:
        that:
          - >-
            item.rc != 0 or
            item.item.address in (terraform_state_addresses.stdout_lines | default([]))
          - >-
            item.rc == 0 or
            item.item.address not in (terraform_state_addresses.stdout_lines | default([]))
        fail_msg: >-
          An application or monitoring stack exists outside the active Terraform
          state, or is recorded in state after deletion. Review/import the existing
          stack before proceeding; automatic adoption is disabled.
      loop: "{{ application_stack_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - terraform_operation == 'plan'
        - lookup('env', 'TF_VAR_deploy_application') | bool

    - name: Create the reviewed infrastructure plan
      ansible.builtin.command:
        argv:
          - terraform
          - plan
          - -input=false
          - -lock-timeout=5m
          - -out=tfplan
        chdir: "{{ terraform_directory }}"
      when: terraform_operation == 'plan'

    - name: Render the plan for Jenkins approval
      ansible.builtin.shell:
        cmd: mkdir -p ../reports && terraform show -no-color tfplan > ../reports/terraform-plan.txt
        chdir: "{{ terraform_directory }}"
      changed_when: true
      when: terraform_operation == 'plan'

    - name: Apply only the saved and approved infrastructure plan
      ansible.builtin.command:
        argv:
          - terraform
          - apply
          - -input=false
          - -lock-timeout=5m
          - tfplan
        chdir: "{{ terraform_directory }}"
      when: terraform_operation == 'apply'

    - name: Read non-sensitive Terraform outputs
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -json
        chdir: "{{ terraform_directory }}"
      register: terraform_outputs
      changed_when: false
      when: terraform_operation == 'apply'
      no_log: true

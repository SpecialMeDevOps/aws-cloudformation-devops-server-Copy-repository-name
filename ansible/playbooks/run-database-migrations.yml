---
- name: Run additive Prisma migrations on an isolated ECS task
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_name: "{{ lookup('env', 'TF_VAR_project_name') | default('it-your-it-house', true) }}"
    environment_name: "{{ lookup('env', 'TF_VAR_environment') | default('dev', true) }}"
  tasks:
    - name: Require explicit migration approval
      ansible.builtin.assert:
        that:
          - approved_database_migration | default(false) | bool
        fail_msg: "Database migrations require explicit approval after reviewing the migration SQL."

    - name: Read live application CloudFormation outputs
      ansible.builtin.command:
        argv:
          - aws
          - cloudformation
          - describe-stacks
          - --stack-name
          - "{{ project_name }}-{{ environment_name }}-application"
          - --query
          - Stacks[0].Outputs
          - --output
          - json
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
      register: application_stack_outputs_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: Classify application stack read failure safely
      ansible.builtin.set_fact:
        application_stack_read_diagnostic: >-
          {% set error_text = application_stack_outputs_raw.stderr | default('') | lower %}
          {% if 'does not exist' in error_text or 'not exist' in error_text %}
          The application stack was not found in the selected AWS account and region.
          {% elif 'accessdenied' in error_text or 'not authorized' in error_text or 'unauthorized' in error_text %}
          The Jenkins IAM role is not authorized to describe the application stack.
          {% elif 'unable to locate credentials' in error_text or 'no credentials' in error_text %}
          AWS credentials were unavailable to the Ansible process.
          {% elif 'could not connect' in error_text or 'could not resolve' in error_text or 'connection timed out' in error_text or 'endpoint url' in error_text %}
          The AWS CLI could not reach the CloudFormation endpoint; check region and agent connectivity.
          {% else %}
          AWS CloudFormation DescribeStacks failed; inspect CloudTrail and restricted Jenkins agent logs.
          {% endif %}
      when: application_stack_outputs_raw.rc != 0
      no_log: true

    - name: Report sanitized application stack read failure
      ansible.builtin.debug:
        msg: >-
          CloudFormation DescribeStacks failed with return code
          {{ application_stack_outputs_raw.rc }}:
          {{ application_stack_read_diagnostic | trim }}
      when: application_stack_outputs_raw.rc != 0

    - name: Stop if the application stack outputs could not be read
      ansible.builtin.fail:
        msg: "Unable to read application CloudFormation outputs; see the sanitized diagnostic above."
      when: application_stack_outputs_raw.rc != 0

    - name: Parse application outputs
      ansible.builtin.set_fact:
        app_outputs: "{{ application_stack_outputs_raw.stdout | from_json | items2dict(key_name='OutputKey', value_name='OutputValue') }}"
      no_log: true

    - name: Validate private migration network outputs
      ansible.builtin.assert:
        that:
          - app_outputs is mapping
          - (app_outputs | default({})).get('PrivateSubnetAId', '') is match('^subnet-[0-9a-f]+$')
          - (app_outputs | default({})).get('PrivateSubnetBId', '') is match('^subnet-[0-9a-f]+$')
          - (app_outputs | default({})).get('PrivateSubnetAId', '') != (app_outputs | default({})).get('PrivateSubnetBId', '')
          - (app_outputs | default({})).get('BackendSecurityGroupId', '') is match('^sg-[0-9a-f]+$')
        fail_msg: >-
          The application CloudFormation outputs must contain two distinct
          private subnet IDs (PrivateSubnetAId and PrivateSubnetBId) and a
          backend security group ID (BackendSecurityGroupId). Values are omitted
          from this diagnostic; verify the deployed application stack outputs.

    - name: Build private task network configuration
      ansible.builtin.set_fact:
        migration_network_configuration:
          awsvpcConfiguration:
            subnets:
              - "{{ app_outputs.PrivateSubnetAId }}"
              - "{{ app_outputs.PrivateSubnetBId }}"
            securityGroups:
              - "{{ app_outputs.BackendSecurityGroupId }}"
            assignPublicIp: DISABLED
      no_log: true

    - name: Start the Prisma migration task
      ansible.builtin.command:
        argv:
          - aws
          - ecs
          - run-task
          - --cluster
          - "{{ app_outputs.ClusterName }}"
          - --launch-type
          - FARGATE
          - --task-definition
          - "{{ app_outputs.BackendTaskDefinitionArn }}"
          - --network-configuration
          - "{{ migration_network_configuration | to_json }}"
          - --overrides
          - >-
            {"containerOverrides":[{"name":"backend","command":["npm","run","prisma:migrate:deploy"]}]}
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
          - --output
          - json
      register: migration_launch
      changed_when: true
      no_log: true

    - name: Parse migration task ARN
      ansible.builtin.set_fact:
        migration_task_arn: "{{ (migration_launch.stdout | from_json).tasks[0].taskArn }}"
      no_log: true

    - name: Wait for the migration task to stop
      ansible.builtin.command:
        argv:
          - aws
          - ecs
          - wait
          - tasks-stopped
          - --cluster
          - "{{ app_outputs.ClusterName }}"
          - --tasks
          - "{{ migration_task_arn }}"
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
      changed_when: false
      async: 1800
      poll: 15
      no_log: true

    - name: Read migration task result
      ansible.builtin.command:
        argv:
          - aws
          - ecs
          - describe-tasks
          - --cluster
          - "{{ app_outputs.ClusterName }}"
          - --tasks
          - "{{ migration_task_arn }}"
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
          - --output
          - json
      register: migration_result
      changed_when: false
      no_log: true

    - name: Require a successful Prisma migration exit code
      ansible.builtin.assert:
        that:
          - (migration_result.stdout | from_json).tasks | length == 1
          - (migration_result.stdout | from_json).tasks[0].containers | selectattr('name', 'equalto', 'backend') | map(attribute='exitCode') | select('equalto', 0) | list | length == 1
        fail_msg: "Prisma migration task failed. Inspect the restricted ECS task logs and stop deployment."
      no_log: true

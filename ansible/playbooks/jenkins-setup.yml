---
- name: Prepare a Jenkins host for CI/CD
  hosts: jenkins
  become: true
  tasks:
    - name: Require explicit approval for Jenkins host changes
      ansible.builtin.assert:
        that:
          - allow_host_package_changes | default(false) | bool
        fail_msg: >-
          This playbook changes the Jenkins host. Re-run only after an authorized
          operator supplies -e allow_host_package_changes=true.

    - name: Ensure required OS packages are installed
      ansible.builtin.apt:
        name:
          - curl
          - git
          - docker.io
          - ca-certificates
          - jq
        state: present
        update_cache: true

    - name: Confirm Docker is available
      ansible.builtin.command: docker --version
      changed_when: false

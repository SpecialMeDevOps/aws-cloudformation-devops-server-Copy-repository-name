---
- name: Verify ECS application deployment and target health
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    terraform_directory: "{{ playbook_dir }}/../../terraform"
  tasks:
    - name: Read deployment outputs
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -json
        chdir: "{{ terraform_directory }}"
      register: outputs_raw
      changed_when: false
      no_log: true

    - name: Parse deployment outputs
      ansible.builtin.set_fact:
        infrastructure_outputs: "{{ outputs_raw.stdout | from_json }}"

    - name: Wait for ECS services to reach steady state
      ansible.builtin.command:
        argv:
          - aws
          - ecs
          - wait
          - services-stable
          - --cluster
          - "{{ infrastructure_outputs.application_outputs.value.ClusterName }}"
          - --services
          - "{{ infrastructure_outputs.application_outputs.value.FrontendServiceName }}"
          - "{{ infrastructure_outputs.application_outputs.value.BackendServiceName }}"
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
      changed_when: false
      async: 1800
      poll: 15

    - name: Wait for the CloudFront distribution to finish deploying
      ansible.builtin.command:
        argv:
          - aws
          - cloudfront
          - wait
          - distribution-deployed
          - --id
          - "{{ infrastructure_outputs.application_outputs.value.CloudFrontDistributionId }}"
      changed_when: false
      async: 2400
      poll: 15

    - name: Verify frontend health endpoint
      ansible.builtin.uri:
        url: "{{ infrastructure_outputs.application_outputs.value.ApplicationUrl }}/api/health"
        method: GET
        status_code: 200
        return_content: false
        timeout: 10
      register: frontend_health
      retries: 20
      delay: 15
      until: frontend_health.status == 200
      changed_when: false

    - name: Verify backend readiness endpoint
      ansible.builtin.uri:
        url: "{{ infrastructure_outputs.application_outputs.value.ApplicationUrl }}/auth/health"
        method: GET
        status_code: 200
        return_content: false
        timeout: 10
      register: backend_health
      retries: 20
      delay: 15
      until: backend_health.status == 200
      changed_when: false

    - name: Verify both ECS target groups are healthy
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-target-health
          - --target-group-arn
          - "{{ item }}"
          - --query
          - TargetHealthDescriptions
          - --output
          - json
          - --region
          - "{{ lookup('env', 'AWS_REGION') }}"
      loop:
        - "{{ infrastructure_outputs.application_outputs.value.FrontendTargetGroupArn }}"
        - "{{ infrastructure_outputs.application_outputs.value.BackendTargetGroupArn }}"
      register: target_health
      changed_when: false
      failed_when: >-
        target_health.stdout | from_json | length < 1 or
        (target_health.stdout | from_json | selectattr('TargetHealth.State', 'ne', 'healthy') | list | length) > 0
      loop_control:
        label: "target group health"

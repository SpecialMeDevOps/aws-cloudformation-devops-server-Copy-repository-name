services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-house-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-house-backend
    environment:
      APP_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/it_your_it_house
      JWT_SECRET: replace-me
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: it-house-postgres
    environment:
      POSTGRES_DB: it_your_it_house
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_your_it_house"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
